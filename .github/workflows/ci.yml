name: CI

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [master]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".github/ISSUE_TEMPLATE/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Keep the required Frontend and Backend checks present on docs-only PRs,
  # but avoid installing toolchains or running their test suites.
  changes:
    name: Detect relevant changes
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.scope.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Detect code changes
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          code=false
          while IFS= read -r path; do
            case "$path" in
              *.md|docs/*|.github/ISSUE_TEMPLATE/*) ;;
              *) code=true; break ;;
            esac
          done < <(git diff --name-only "$BASE_SHA...$HEAD_SHA")

          echo "code=$code" >> "$GITHUB_OUTPUT"

  frontend:
    name: Frontend
    needs: changes
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    steps:
      - name: Require successful change detection
        if: needs.changes.result != 'success'
        run: exit 1

      - name: No code changes
        if: needs.changes.outputs.code != 'true'
        run: echo "Only documentation or issue forms changed; frontend checks are not needed."

      - if: needs.changes.outputs.code == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: needs.changes.outputs.code == 'true'
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11.25.0
      - if: needs.changes.outputs.code == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - if: needs.changes.outputs.code == 'true'
        run: pnpm install --frozen-lockfile
      - if: needs.changes.outputs.code == 'true'
        run: pnpm --filter @hexdesk/frontend exec playwright install --with-deps chromium
      - if: needs.changes.outputs.code == 'true'
        run: pnpm format:check
      - if: needs.changes.outputs.code == 'true'
        run: pnpm lint
      - if: needs.changes.outputs.code == 'true'
        run: pnpm typecheck
      - if: needs.changes.outputs.code == 'true'
        run: pnpm test:frontend
      - if: needs.changes.outputs.code == 'true'
        run: pnpm build

  backend:
    name: Backend
    needs: changes
    if: ${{ always() }}
    runs-on: windows-latest
    steps:
      - name: Require successful change detection
        if: needs.changes.result != 'success'
        run: exit 1

      - name: No code changes
        if: needs.changes.outputs.code != 'true'
        run: echo "Only documentation or issue forms changed; backend checks are not needed."

      - if: needs.changes.outputs.code == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: needs.changes.outputs.code == 'true'
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc
        with:
          toolchain: 1.97.0
          components: rustfmt
          targets: x86_64-pc-windows-msvc
      - if: needs.changes.outputs.code == 'true'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - if: needs.changes.outputs.code == 'true'
        run: cargo fmt --all -- --check
      - if: needs.changes.outputs.code == 'true'
        run: cargo check --workspace --all-targets
      - if: needs.changes.outputs.code == 'true'
        run: cargo test --workspace
